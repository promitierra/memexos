[tooluse]
help = "工具使用测评：Agent 只用命令行去做真实的事（检索题库里的问题，加上 .memex/evals/tooluse/scenarios.jsonl 里的任务场景）；每一次 memex 调用都被记录下来，并和场景的参考流程对照：命令对不对、参数对不对、比最少需要的次数多调了几次。会改动东西的命令只记录、不执行。"
title = "# 工具使用测评 · {run}"
intro = "每个 Agent 只用命令行完成全部场景。*做对*：必需的调用都发生了、参数正确、没有不该有的调用，问答题的回答也被判为正确。*调用正确率*：参数正确的调用占全部调用的比例。*实际 / 最少调用*：平均实际调用次数和能力强的 Agent 最少需要的次数；*效率* = 最少次数 ÷ 实际次数，只算做对的场景（100% 表示没有绕路）。"
cols = ["Agent", "场景数", "做对", "参考调用都做到", "调用正确率", "实际 / 最少调用", "效率", "失败的调用", "重复的调用", "第几次调用才看到正确页面", "每个场景耗时", "每个场景 token"]
by_type = "按场景类型"
type_cols = ["Agent", "类型", "场景数", "参考调用都做到", "实际 / 最少调用"]
misses = "绕路和出错的地方"
expected = "参考流程：{steps}（最少 {min} 次调用）"
actual = "实际调用 {n} 次；参考步骤做到 {steps}；做对：{ok}"
yes = "是"
no = "否"
arg_problem = "参数问题：{text}"
forbidden = "不该调用：{text}"
